[package]
name = "jusong"
version = "0.1.4"
description = "沮诵 · 本地优先电子书阅读器"
authors = ["Jusong"]
edition = "2021"

[lib]
name = "jusong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
# 导入导出：解析包 zip（只启用 deflate，避免 aes/bzip2/zstd 等重依赖）。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 解析包私有容器 `.jusong`：AES-256-GCM 加密（固定内置密钥，仅混淆，不是强保密）。
aes-gcm = "0.10"

# AGENT 网络层：仅桌面/移动非 Android 目标启用（Android 走 NOT_SUPPORTED 降级，
# 避免引入 native-tls/openssl 交叉编译负担）。Tauri 自身已依赖 reqwest 0.13 核心。
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "native-tls",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
